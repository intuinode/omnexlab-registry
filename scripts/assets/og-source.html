<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1280px; height:640px; overflow:hidden; font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; color:#e8ecf4;
         background:radial-gradient(900px 500px at 12% 10%, rgba(79,70,229,.55), transparent 60%), radial-gradient(800px 520px at 95% 95%, rgba(13,148,136,.5), transparent 60%), #0a0e16; }
  .wrap { position:absolute; inset:0; padding:70px 84px; display:flex; flex-direction:column; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:18px; font-size:34px; font-weight:700; letter-spacing:-.01em; }
  .logo { width:60px; height:60px; border-radius:16px; background:linear-gradient(135deg,#4f46e5,#0d9488); display:grid; place-items:center; }
  .logo i { width:26px; height:26px; border:6px solid #fff; border-radius:50%; display:block; }
  h1 { font-size:84px; line-height:1.04; letter-spacing:-.035em; font-weight:800; }
  h1 span { background:linear-gradient(90deg,#8b93ff,#35d0c6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .pill { display:inline-flex; align-items:center; gap:14px; margin-top:34px; padding:16px 30px; border-radius:999px; background:#121826; border:2px solid #222c3e; font-size:38px; }
  .pill b { color:#fff; } .pill em { color:#98a3b8; font-style:normal; } .lock { color:#4fd18b; font-size:32px; }
  .foot { display:flex; gap:14px; font-size:26px; color:#98a3b8; }
  .foot span { padding:8px 20px; border:2px solid #222c3e; border-radius:999px; background:rgba(18,24,38,.7); }
</style></head>
<body><div class="wrap">
  <div class="brand"><div class="logo"><i></i></div>omnexlab.site</div>
  <div>
    <h1>Free subdomains<br><span>for your projects.</span></h1>
    <div class="pill"><span class="lock">&#128274;</span><em>https://</em><b>yourname</b><em>.omnexlab.site</em></div>
  </div>
  <div class="foot"><span>Vercel</span><span>GitHub Pages</span><span>HTTPS included</span><span>$0</span></div>
</div></body></html>

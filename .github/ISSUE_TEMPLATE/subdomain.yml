name: "🌐 Get a free subdomain"
description: Request yourname.omnexlab.site. A bot sets it up in about a minute.
title: "Subdomain request"
labels: ["subdomain-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🌐 Get your free subdomain

        > ### ⚠️ Do this first
        > Add `yourname.omnexlab.site` as a custom domain **in your host** before you submit.
        > - **Vercel:** Project → Settings → Domains
        > - **GitHub Pages:** Repository → Settings → Pages → Custom domain
        >
        > A "DNS not configured" warning there is fine. This stops anyone else claiming the name.

        Then fill in the boxes and press **Submit new issue**. Your GitHub username is picked up automatically, and a bot replies here in about a minute.
        📖 Need help? See the [guides](https://omnexlab.site/guides.html).
  - type: dropdown
    id: action
    attributes:
      label: What do you want to do?
      options:
        - Create a new subdomain
        - Change where my subdomain points
        - Remove my subdomain
      default: 0
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Subdomain name
      description: Just the first part. For myapp.omnexlab.site, type myapp (3-32 letters, digits or hyphens).
      placeholder: myapp
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Where your site lives (address only)
      description: Not needed when removing. Vercel myproject.vercel.app, GitHub Pages username.github.io.
      placeholder: myproject.vercel.app
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Traffic mode
      description: Through Cloudflare gives instant HTTPS, but HTTPS is decrypted at Cloudflare before it reaches your host. Direct sends visitors straight to your host (your host issues the certificate).
      options:
        - Through Cloudflare (instant HTTPS, recommended for public sites)
        - Direct to my host (DNS only, HTTPS from your host)
      default: 0
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        > **Not for sensitive data.** Free shared subdomains are for portfolios, demos and side projects. Do not use them for logins, private data or payments.

        ---
        By submitting you agree to the [Terms](https://omnexlab.site/terms.html) and [Privacy Policy](https://omnexlab.site/privacy.html). This issue and your GitHub username are **public**. We only provide DNS and are not responsible for your site.

name: Automerge

# Runs in the context of the base repo after "Validate" succeeds. It never checks out
# or executes code from the pull request.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr
          path: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Merge if it only touches domains/*.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          N="$(tr -d '[:space:]' < pr/number)"
          [[ "$N" =~ ^[0-9]+$ ]] || { echo "bad PR number"; exit 1; }

          CURRENT_HEAD="$(gh api "repos/$REPO/pulls/$N" --jq .head.sha)"
          [ "$CURRENT_HEAD" = "$HEAD_SHA" ] || { echo "PR changed after validation; skipping"; exit 0; }

          OTHER="$(gh api "repos/$REPO/pulls/$N/files" --paginate \
            --jq '.[] | select(.filename | test("^domains/[a-z0-9-]+\\.json$") | not) | .filename')"
          if [ -n "$OTHER" ]; then
            echo "PR touches files outside domains/ - needs a manual review:"; echo "$OTHER"; exit 0
          fi

          gh pr merge "$N" --repo "$REPO" --squash
          # Merges made with GITHUB_TOKEN do not trigger push workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --repo "$REPO" --ref main

name: Deploy DNS

on:
  push:
    branches: [main]
    paths: ['domains/**', 'config.json', 'scripts/**']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # daily reconcile: repairs any drift in Cloudflare

concurrency:
  group: deploy-dns
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: node scripts/validate.js --all
      - name: Sync Cloudflare DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/sync.js
      - name: Refresh the public data files (registry.json, rules.json)
        run: |
          node scripts/build-public.js
          if git diff --quiet -- docs/registry.json docs/rules.json; then echo "Public data files unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.json docs/rules.json
          git commit -m "Refresh public data files"
          git pull --rebase origin main
          git push origin main

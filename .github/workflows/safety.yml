name: Safety check

# Daily check of every subdomain against public threat lists.
# Severe findings remove the name; mild ones warn the owner first. See scripts/safety-monitor.js.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: registry-writes
  cancel-in-progress: false
  # keep every waiting run (the default keeps only one and silently drops the rest)
  queue: max

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a queued run must see the latest registry, not the state when it was triggered
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check subdomains against threat lists
        id: safety
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SAFE_BROWSING_API_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
        run: node scripts/safety-monitor.js
      - name: Commit removals and update DNS
        if: steps.safety.outputs.removed != '0' && steps.safety.outputs.removed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A domains
          git commit -m "Remove subdomains flagged as harmful by the safety check"
          git pull --rebase origin main
          git push origin main
          gh workflow run deploy.yml --ref main
